plugins { id 'com.android.application' }

def legacyMitv3 = providers.gradleProperty('mitv3').map { it.toBoolean() }.getOrElse(false)

android {
    namespace 'io.github.op7418.guizangtv'
    compileSdk 34
    buildFeatures { buildConfig true }
    defaultConfig {
        applicationId legacyMitv3 ? 'io.github.op7418.guizangtv.mitv3' : 'io.github.op7418.guizangtv'
        minSdk legacyMitv3 ? 22 : 26
        targetSdk 34
        versionCode legacyMitv3 ? 9 : 6
        versionName legacyMitv3 ? '0.4.0-dev-mitv3.3' : '0.4.0-dev'
        buildConfigField 'boolean', 'LEGACY_MITV3', legacyMitv3.toString()
        manifestPlaceholders = [appLabel: legacyMitv3 ? '归藏电视 · MiTV3' : '归藏电视',
                                bootGateEnabled: (!legacyMitv3).toString(),
                                legacyHomeEnabled: legacyMitv3.toString()]
    }
    signingConfigs {
        release {
            if (System.getenv('GUIZANG_KEYSTORE')) {
                storeFile file(System.getenv('GUIZANG_KEYSTORE'))
                storePassword System.getenv('GUIZANG_STORE_PASSWORD')
                keyAlias System.getenv('GUIZANG_KEY_ALIAS') ?: 'guizang-tv'
                keyPassword System.getenv('GUIZANG_KEY_PASSWORD') ?: System.getenv('GUIZANG_STORE_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (System.getenv('GUIZANG_KEYSTORE')) signingConfig signingConfigs.release
        }
    }
    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    testImplementation 'junit:junit:4.13.2'
}
